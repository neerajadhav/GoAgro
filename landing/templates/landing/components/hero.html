{% load static %}
<!-- Hero Section Component -->
<section
  class="flex flex-col items-center justify-center flex-1 text-center pt-32 pb-20 px-4 relative min-h-[600px]"
  style="
    background-image: linear-gradient(
        rgba(22, 101, 52, 0.7),
        rgba(22, 101, 52, 0.7)
      ),
      url('https://images.unsplash.com/photo-1597150879123-20d7fa49f198?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80');
    background-size: cover;
    background-position: center;
  "
>
  <img
    src="{% static 'images/logo.png' %}"
    alt="GoAgro Logo"
    class="w-24 mb-6 mx-auto drop-shadow-lg"
  />
  <h1
    class="text-5xl md:text-6xl font-extrabold text-white mb-6 leading-tight drop-shadow"
  >
    Empowering Modern Agriculture
  </h1>
  <p class="text-xl md:text-2xl text-white mb-8 max-w-2xl mx-auto">
    Connect, share, and grow with the GoAgro community. The all-in-one platform
    for farmers, agri-enthusiasts, and agri-businesses.
  </p>
  <div class="flex flex-wrap justify-center gap-4 mb-8">
    <a
      href="{% url 'signup' %}"
      class="px-8 py-3 rounded-full bg-green-600 text-white font-semibold shadow hover:bg-green-700 transition text-lg"
      >Get Started</a
    >
    <a
      href="#features"
      class="px-8 py-3 rounded-full border-2 border-green-600 text-white font-semibold hover:bg-green-600 hover:text-white transition text-lg"
      >Learn More</a
    >
  </div>
</section>
