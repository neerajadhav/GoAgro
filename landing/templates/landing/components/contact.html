<!-- Contact Us Section Component -->
<section id="contact" class="py-20 bg-green-900">
  <div class="max-w-2xl mx-auto px-4">
    <h2 class="text-4xl font-bold text-center text-green-100 mb-8">Contact Us</h2>
    <form class="space-y-6 bg-green-800 p-8 rounded-2xl shadow-lg border border-green-700">
      <div>
        <input type="text" class="w-full px-4 py-3 rounded-lg bg-green-900 text-green-100 placeholder-green-300 border border-green-700 focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Your Name" required>
      </div>
      <div>
        <input type="email" class="w-full px-4 py-3 rounded-lg bg-green-900 text-green-100 placeholder-green-300 border border-green-700 focus:outline-none focus:ring-2 focus:ring-green-400" placeholder="Your Email" required>
      </div>
      <div>
        <textarea class="w-full px-4 py-3 rounded-lg bg-green-900 text-green-100 placeholder-green-300 border border-green-700 focus:outline-none focus:ring-2 focus:ring-green-400" rows="4" placeholder="Your Message" required></textarea>
      </div>
      <div>
        <button type="submit" class="w-full py-3 rounded-lg bg-green-600 text-white font-semibold shadow hover:bg-green-700 transition">Send Message</button>
      </div>
    </form>
  </div>
</section>
