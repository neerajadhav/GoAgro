{% extends 'landing/base.html' %}
{% load static %}
{% block title %}Login | GoAgro{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[80vh] py-12 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 border border-green-100">
    <div class="flex flex-col items-center mb-6">
      <img src="{% static 'images/authlogo.png' %}" alt="GoAgro Logo" class="w-16 mb-2">
      <h2 class="text-2xl font-bold text-green-600">Login to GoAgro</h2>
    </div>
    {% for i in messages %}
      <div class="mb-4 text-red-600 text-center">{{ i }}</div>
    {% endfor %}
    <form method="post" action="">
      {% csrf_token %}
      <div class="mb-4">
        <input type="text" name="username" placeholder="Username" class="w-full px-4 py-3 rounded-lg bg-green-50 text-gray-900 placeholder-green-600 border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400" required>
      </div>
      <div class="mb-6">
        <input type="password" name="password" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-green-50 text-gray-900 placeholder-green-600 border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400" required>
      </div>
      <button type="submit" class="w-full py-3 rounded-lg bg-green-600 text-white font-semibold shadow hover:bg-green-700 transition">Login</button>
    </form>
    <div class="mt-6 text-center text-gray-600">
      Don't have an account? <a href="{% url 'signup' %}" class="text-green-600 hover:underline">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}
